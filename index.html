<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CJC · Centro de Monitoreo</title>
<style>
  /* ==========================================================
     CJC — CENTRO DE MONITOREO · pantalla de sala de control
     El fondo es un video pregrabado (nada de 3D en vivo): el
     reproductor solo decodifica H.264. Encima van el logo fijo,
     el título y la hora de RD en formato de 12 horas.
     ?formato=ancho | 16x9  fuerza la versión del video
     (por defecto: ancha si la pantalla es más de 2.4 veces más ancha que alta)
     ========================================================== */
  :root{
    color-scheme: dark;
    --ink:#020a16;
    --cyan:#5fe0f2;
    --orange:#ff7a00;
    --white:#eef6ff;
    --soft:rgba(205,228,248,.7);
    --ui:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--ink)}
  body{color:var(--white);font-family:var(--ui);-webkit-font-smoothing:antialiased;cursor:default}
  body.idle{cursor:none}

  #fondo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:var(--ink);display:block}

  /* franja superior: el video ya trae el degradado oscuro detrás */
  #franja{position:fixed;left:0;right:0;top:0;height:var(--fr);display:flex;align-items:center;
    padding:0 var(--m);gap:var(--g);pointer-events:none;z-index:2}
  #logo{height:calc(var(--fr) * .46);width:auto;display:block;flex:none}
  #sep{width:2px;height:calc(var(--fr) * .44);background:linear-gradient(180deg,transparent,rgba(95,224,242,.55),transparent);flex:none}
  #titulo .k{display:flex;align-items:center;gap:.7em;font-weight:700;font-size:calc(var(--fr) * .105);
    letter-spacing:.24em;text-transform:uppercase;color:var(--cyan);white-space:nowrap}
  #titulo .k::before{content:'';width:1.9em;height:.2em;background:var(--orange)}
  #titulo .t{font-weight:800;font-size:calc(var(--fr) * .25);letter-spacing:-.01em;line-height:1.05;margin-top:.16em;white-space:nowrap}
  #reloj{margin-left:auto;text-align:right;white-space:nowrap}
  #hora{font-weight:700;font-size:calc(var(--fr) * .3);line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  #hora .s{font-size:.55em;color:var(--soft);font-weight:600}
  #hora .ap{font-size:.5em;font-weight:700;color:var(--cyan);margin-left:.25em;letter-spacing:.04em}
  #fecha{margin-top:.38em;font-weight:600;font-size:calc(var(--fr) * .115);color:var(--soft);letter-spacing:.02em}
  #fecha::first-letter{text-transform:uppercase}

  /* 16:9 → la franja ocupa el 13,9 % de alto del video; ancho (LED) → 15 % */
  body{--fr:13.9vh;--m:3.6vw;--g:2.2vw}
  body.ancho{--fr:15vh;--m:2.6vw;--g:1.6vw}
  /* pantallas más altas que 16:9 (el video se recorta a los lados): la franja sigue al ancho */
  @media (max-aspect-ratio: 16/9){ body:not(.ancho){--fr:7.8vw} }
</style>
</head>
<body>
<video id="fondo" autoplay muted loop playsinline preload="auto" disablepictureinpicture></video>

<div id="franja">
  <img id="logo" src="media/cjc-logo.png" alt="CJC">
  <div id="sep"></div>
  <div id="titulo"><div class="k">CJC · En vivo</div><div class="t">Centro de Monitoreo</div></div>
  <div id="reloj"><div id="hora"></div><div id="fecha"></div></div>
</div>

<script>
(function(){
  var q = new URLSearchParams(location.search);
  var f = q.get('formato');
  var ancho = f ? f === 'ancho' : (innerWidth / innerHeight > 2.4);
  if (ancho) document.body.classList.add('ancho');
  var v = document.getElementById('fondo');
  var base = ancho ? 'media/noc-ancho' : 'media/noc-16x9';
  v.poster = base + '.jpg';
  v.src = base + '.mp4';
  // si la versión ancha no carga, cae a la 16:9 (nunca pantalla negra)
  v.addEventListener('error', function(){
    if (v.src.indexOf('noc-ancho') >= 0) { v.poster = 'media/noc-16x9.jpg'; v.src = 'media/noc-16x9.mp4'; intentar(); }
  });
  // algunos reproductores no arrancan solos aunque el video esté en silencio: reintento suave
  var intentar = function(){ var p = v.play(); if (p && p.catch) p.catch(function(){}); };
  v.addEventListener('canplay', intentar);
  setInterval(function(){ if (v.paused) intentar(); }, 5000);
  // si el reproductor se queda colgado en el mismo cuadro, recarga el video
  var ultimo = -1, quieto = 0;
  setInterval(function(){
    if (v.currentTime === ultimo && !v.paused) { if (++quieto >= 3) { v.load(); intentar(); quieto = 0; } }
    else quieto = 0;
    ultimo = v.currentTime;
  }, 4000);

  // ---- hora de República Dominicana (UTC−4 todo el año, sin horario de verano), formato de 12 horas
  var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var hora = document.getElementById('hora'), fecha = document.getElementById('fecha');
  var dos = function(n){ return (n < 10 ? '0' : '') + n; };
  function tic(){
    var d = new Date(Date.now() - 4 * 3600e3);
    var h = d.getUTCHours(), h12 = h % 12 || 12;
    hora.innerHTML = h12 + ':' + dos(d.getUTCMinutes()) + '<span class="s">:' + dos(d.getUTCSeconds()) + '</span><span class="ap">' + (h < 12 ? 'a. m.' : 'p. m.') + '</span>';
    fecha.textContent = DIAS[d.getUTCDay()] + ', ' + d.getUTCDate() + ' de ' + MESES[d.getUTCMonth()] + ' de ' + d.getUTCFullYear();
  }
  tic();
  setTimeout(function(){ tic(); setInterval(tic, 1000); }, 1000 - Date.now() % 1000);   // en el cambio exacto de segundo

  // clic = pantalla completa; el cursor se oculta en reposo
  document.addEventListener('click', function(){
    var e = document.documentElement;
    if (!document.fullscreenElement && e.requestFullscreen) e.requestFullscreen().catch(function(){});
    intentar();
  });
  var t;
  document.addEventListener('mousemove', function(){ document.body.classList.remove('idle'); clearTimeout(t); t = setTimeout(function(){ document.body.classList.add('idle'); }, 2500); });
})();
</script>
</body>
</html>
