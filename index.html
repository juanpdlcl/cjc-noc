<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body>
<title>CJC · Network Operations Center</title>
<style>
  /* ==========================================================
     CJC ENGINEERING GROUP — NOC AMBIENT WALL · single-theme dark
     (deliberate: this is a screen for a dark operations room)
     ========================================================== */
  :root{
    color-scheme: dark;
    --ink:#030b18;            /* abyss */
    --navy:#0d2340;           /* brand navy (logo ground) */
    --blue:#1f5fa0;           /* brand blue */
    --cyan:#33c4ff;           /* signal */
    --orange:#ff7a00;         /* brand accent — radar edge & comets only */
    --white:#eef6ff;          /* blue-biased white */
    --good:#37e08e;
    --mono:"Cascadia Mono","Cascadia Code",Consolas,"Roboto Mono",monospace;
    --ui:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;width:100%;overflow:hidden}
  body{
    background:var(--ink);
    background-image:
      radial-gradient(130% 100% at 50% 38%, #0b2447 0%, #071731 45%, var(--ink) 82%, #02060f 100%);
    color:var(--white);
    font-family:var(--ui);
    -webkit-font-smoothing:antialiased;
    cursor:default;
  }
  body.idle{cursor:none}
  #stage{position:fixed;inset:0;overflow:hidden}
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* faint CRT scanlines + vignette — texture, not decoration */
  #scanlines{position:absolute;inset:0;pointer-events:none;z-index:6;opacity:.05;
    background:repeating-linear-gradient(0deg,rgba(210,235,255,.5) 0 1px,transparent 1px 3px)}
  #vignette{position:absolute;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(120% 95% at 50% 46%, transparent 55%, rgba(2,6,15,.55) 88%, rgba(2,6,15,.9) 100%)}

  /* ---------- brand block ---------- */
  #brand{position:absolute;top:3.2vh;left:50%;transform:translateX(-50%);
    z-index:8;display:flex;flex-direction:column;align-items:center;gap:1.6vh;
    pointer-events:none;text-align:center}
  #brand img{
    width:min(30vw,360px);height:auto;display:block;
    filter:drop-shadow(0 0 26px rgba(51,196,255,.22));
    animation:glint 12s ease-in-out infinite, lev 9s ease-in-out infinite;
  }
  @keyframes lev{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes glint{
    0%,88%,100%{filter:drop-shadow(0 0 26px rgba(51,196,255,.22)) brightness(1)}
    92%{filter:drop-shadow(0 0 42px rgba(51,196,255,.55)) brightness(1.28)}
    96%{filter:drop-shadow(0 0 30px rgba(51,196,255,.3)) brightness(1.04)}
  }
  #brand .sub{display:flex;align-items:center;gap:16px;width:min(40vw,470px)}
  #brand .sub .rule{flex:1;height:1px;
    background:linear-gradient(90deg,transparent,rgba(51,196,255,.55))}
  #brand .sub .rule:last-child{transform:scaleX(-1)}
  #brand .sub span{
    font-family:var(--mono);font-size:clamp(9px,1.15vw,13px);font-weight:500;
    letter-spacing:.46em;text-indent:.46em;white-space:nowrap;
    color:rgba(160,216,255,.85)}

  /* ---------- HUD corners ---------- */
  .corner{position:absolute;width:34px;height:34px;z-index:7;
    border:0 solid rgba(51,196,255,.4);animation:cornerpulse 5s ease-in-out infinite}
  @keyframes cornerpulse{0%,100%{opacity:.55}50%{opacity:1}}
  .corner.tl{top:18px;left:18px;border-top-width:2px;border-left-width:2px}
  .corner.tr{top:18px;right:18px;border-top-width:2px;border-right-width:2px}
  .corner.bl{bottom:18px;left:18px;border-bottom-width:2px;border-left-width:2px}
  .corner.br{bottom:18px;right:18px;border-bottom-width:2px;border-right-width:2px}

  .hud{position:absolute;z-index:7;font-family:var(--mono);
    font-size:clamp(9px,.95vw,12px);letter-spacing:.22em;color:rgba(150,205,250,.75);
    display:flex;align-items:center;gap:10px;white-space:nowrap}
  .hud .dot{width:7px;height:7px;border-radius:50%;background:var(--good);
    box-shadow:0 0 8px var(--good);animation:pulse 2.4s ease-in-out infinite}
  #hud-tl{top:26px;left:66px}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* ---------- bottom telemetry bar ---------- */
  #bar{position:absolute;left:0;right:0;bottom:0;height:9.5vh;min-height:64px;z-index:8;
    display:grid;grid-template-columns:auto 1fr auto;align-items:center;
    gap:3vw;padding:0 66px 1.2vh;
    background:linear-gradient(180deg,transparent,rgba(3,9,20,.82) 55%)}
  /* reloj — posición estratégica: esquina superior derecha, siempre visible */
  #clock{position:absolute;top:22px;right:66px;z-index:8;
    display:flex;flex-direction:column;align-items:flex-end;gap:3px;
    font-family:var(--mono);text-align:right}
  #clock .time{font-size:clamp(20px,2.5vw,36px);font-weight:300;
    font-variant-numeric:tabular-nums;letter-spacing:.06em;color:var(--white);
    line-height:1;text-shadow:0 0 18px rgba(51,196,255,.35)}
  #clock .time b{font-weight:300;color:var(--cyan);animation:pulse 1s steps(1) infinite}
  #clock .date{font-size:clamp(8px,.85vw,11px);letter-spacing:.28em;white-space:nowrap;
    color:rgba(150,205,250,.7);text-transform:uppercase}
  #bar-label{font-family:var(--mono);font-size:clamp(9px,.95vw,12px);
    letter-spacing:.22em;color:rgba(150,205,250,.7);white-space:nowrap}

  /* ecualizador de telemetría — animación pura, sin palabras */
  #wave{height:100%;display:flex;align-items:center;justify-content:center;gap:4px}
  #wave i{width:2px;height:24px;border-radius:1px;background:rgba(80,180,255,.5);
    transform-origin:center;animation:eq 1.2s ease-in-out infinite alternate}
  #wave i.o{background:rgba(255,140,40,.7)}
  @keyframes eq{from{transform:scaleY(.14)}to{transform:scaleY(1)}}

  #status{display:flex;gap:2.2vw;align-items:center}
  .chip{display:flex;flex-direction:column;gap:5px;font-family:var(--mono)}
  .chip .k{font-size:clamp(8px,.8vw,10px);letter-spacing:.3em;color:rgba(150,205,250,.55)}
  .chip .v{font-size:clamp(11px,1.15vw,15px);letter-spacing:.14em;color:var(--white);
    display:flex;align-items:center;gap:8px}
  .chip .v .dot{width:8px;height:8px;border-radius:50%;background:var(--good);
    box-shadow:0 0 10px var(--good);animation:pulse 2.4s ease-in-out infinite}
  .chip .v .dot.c{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}

  /* ---------- side labels ---------- */
  .side{position:absolute;top:50%;z-index:7;font-family:var(--mono);
    font-size:clamp(8px,.8vw,10px);letter-spacing:.5em;color:rgba(120,180,235,.4);
    white-space:nowrap;pointer-events:none}
  .side.l{left:26px;transform:translateY(-50%) rotate(180deg);writing-mode:vertical-rl}
  .side.r{right:26px;transform:translateY(-50%);writing-mode:vertical-rl}

  #hint{position:absolute;bottom:calc(9.5vh + 26px);left:66px;z-index:7;
    font-family:var(--mono);font-size:10px;letter-spacing:.24em;
    color:rgba(120,180,235,.45);transition:opacity 1s;pointer-events:none}
  body.idle #hint{opacity:0}

  /* ventanas estrechas: se conserva lo esencial */
  @media (max-width: 900px){
    .side,#hint,#hud-tl,#status,#bar-label{display:none}
    #bar{grid-template-columns:1fr;gap:0;padding:0 24px 1vh}
    #brand img{width:min(56vw,340px)}
    #brand .sub span{letter-spacing:.3em;text-indent:.3em}
    #clock{top:14px;right:16px}
    #clock .time{font-size:15px}
    #clock .date{display:none}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important}
  }
</style>

/* ============================================================
   PROYECCIÓN 3D — mesa holográfica
   ============================================================ */
const cv = document.getElementById('scene');
const ctx = cv.getContext('2d');
let W=0,H=0,DPR=1,CX=0,CY=0,FOC=900;

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX = W*0.5; CY = H*0.565;
  FOC = W<700 ? W*1.16 : Math.min(W*0.94, H*1.56);
}
window.addEventListener('resize', resize); resize();

/* cámara — funciones continuas de t → loop infinito sin cortes */
let cam = {cy:1,sy:0,cp:1,sp:0,dist:1000,zoom:1};
function camera(t){
  const yaw   = Math.sin(t*0.047)*0.16;
  const pitch = 0.60 + Math.sin(t*0.031)*0.04;    /* mesa holográfica ~34° */
  const dist  = 1230 + Math.sin(t*0.019)*60;      /* respiración */
  cam.cy=Math.cos(yaw); cam.sy=Math.sin(yaw);
  cam.cp=Math.cos(pitch); cam.sp=Math.sin(pitch);
  cam.dist=dist;
}
/* mundo: x→derecha, z→sur, y→arriba. Devuelve [sx,sy,escala] */
function P(x,y,z){
  const xr =  x*cam.cy + z*cam.sy;
  const zr = -x*cam.sy + z*cam.cy;
  const yv = y*cam.cp - zr*cam.sp;
  const zv = cam.dist - (y*cam.sp + zr*cam.cp);
  const s = FOC/zv;
  return [CX + xr*s, CY - yv*s, s];
}

/* ============================================================
   PREPROCESO — parse de paths y proyección geográfica
   ============================================================ */
const B = MAP.bounds;
/* rings: [Float64Array xy...] por provincia */
const PROV = MAP.provinces.map(p=>{
  const rings=[]; let cur=null;
  const tok = p.path.match(/[MLZ]|-?\d+(?:\.\d+)?/g)||[];
  for(let i=0;i<tok.length;i++){
    const c=tok[i];
    if(c==='M'){ cur=[]; rings.push(cur); cur.push(+tok[++i],+tok[++i]); }
    else if(c==='L'){ cur.push(+tok[++i],+tok[++i]); }
  }
  const R=rings.map(r=>{ const a=new Float64Array(r);
    for(let i=0;i<a.length;i+=2){a[i]-=500;a[i+1]-=325;} return a; });
  const big=R.reduce((m,r)=>r.length>m.length?r:m,R[0]); /* contorno principal */
  return {name:p.name, cx:p.cx-500, cz:p.cy-325, rings:R, big};
});
/* extensión REAL del dibujo (el SVG trae márgenes: ~55px por lado);
   los bounds geográficos corresponden a esta caja, no al viewBox completo */
let XMIN=1e9,XMAX=-1e9,ZMIN=1e9,ZMAX=-1e9;
for(const pr of PROV) for(const r of pr.rings)
  for(let i=0;i<r.length;i+=2){
    if(r[i]<XMIN)XMIN=r[i]; if(r[i]>XMAX)XMAX=r[i];
    if(r[i+1]<ZMIN)ZMIN=r[i+1]; if(r[i+1]>ZMAX)ZMAX=r[i+1];
  }
function geo(la,lo){ /* lat/lon → espacio de mapa centrado, calibrado al trazo */
  const x = XMIN + (lo-B.west)/(B.east-B.west)*(XMAX-XMIN);
  const z = ZMIN + (B.north-la)/(B.north-B.south)*(ZMAX-ZMIN);
  return [x,z];
}
const NODES = CITIES.map(c=>{ const [x,z]=geo(c.la,c.lo); return {...c,x,z}; });
const HUB = NODES[0];

/* ============================================================
   RENDER
   ============================================================ */
const TAU = Math.PI*2;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ======= ciclo maestro: entrada → crucero → disolución ======= */
const CYC = 48;                                   /* segundos por ciclo */
const sm = x => x<=0?0:x>=1?1:x*x*(3-2*x);        /* smoothstep */
const RANK=(()=>{                                  /* orden oeste→este */
  const idx=PROV.map((_,i)=>i).sort((a,b)=>PROV[a].cx-PROV[b].cx);
  const r=new Array(PROV.length); idx.forEach((pi,k)=>r[pi]=k); return r;
})();
function entrance(tc){
  return PROV.map((_,i)=>{
    const start=0.5+(RANK[i]/(PROV.length-1))*2.6;
    const p=sm((tc-start)/1.2);
    return {p, y:-(1-p)*70, start};
  });
}

function ring2path(path,ring,y){
  let p=P(ring[0],y,ring[1]);
  path.moveTo(p[0],p[1]);
  for(let i=2;i<ring.length;i+=2){ p=P(ring[i],y,ring[i+1]); path.lineTo(p[0],p[1]); }
  path.closePath();
}

/* cruces del suelo — parpadeo aleatorio precomputado */
const CROSSES=(function(){
  let seed=29; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const a=[];
  for(let i=0;i<70;i++) a.push({x:(rnd()*2-1)*740,z:(rnd()*2-1)*470,ph:rnd()*TAU,f:.6+rnd()*1.6});
  return a;
})();

function drawGrid(t){
  ctx.lineWidth=1;
  const off=(t*6)%70;              /* deriva lenta del suelo */
  for(let gx=-770+off;gx<=770;gx+=70){
    const a=P(gx,0,-500), b=P(gx,0,500);
    const g=ctx.createLinearGradient(a[0],a[1],b[0],b[1]);
    const al=0.05*(1-Math.abs(gx)/900);
    g.addColorStop(0,'rgba(51,150,255,0)');
    g.addColorStop(.5,`rgba(51,150,255,${al})`);
    g.addColorStop(1,'rgba(51,150,255,0)');
    ctx.strokeStyle=g; ctx.beginPath();
    ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  }
  for(let gz=-490+off;gz<=490;gz+=70){
    const a=P(-780,0,gz), b=P(780,0,gz);
    const g=ctx.createLinearGradient(a[0],a[1],b[0],b[1]);
    const al=0.05*(1-Math.abs(gz)/620);
    g.addColorStop(0,'rgba(51,150,255,0)');
    g.addColorStop(.5,`rgba(51,150,255,${al})`);
    g.addColorStop(1,'rgba(51,150,255,0)');
    ctx.strokeStyle=g; ctx.beginPath();
    ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  }
  /* cruces titilando sobre el suelo */
  for(const c of CROSSES){
    const tw=.5+.5*Math.sin(t*c.f+c.ph);
    if(tw<0.25) continue;
    const p=P(c.x,0,c.z), s=4*p[2];
    ctx.strokeStyle=`rgba(90,180,255,${(tw*0.22).toFixed(3)})`;
    ctx.beginPath();
    ctx.moveTo(p[0]-s,p[1]); ctx.lineTo(p[0]+s,p[1]);
    ctx.moveTo(p[0],p[1]-s*0.5); ctx.lineTo(p[0],p[1]+s*0.5);
    ctx.stroke();
  }
}

function drawGlow(){
  /* resplandor elíptico bajo la isla — asienta el holograma */
  const c=P(0,0,30);
  const g=ctx.createRadialGradient(c[0],c[1],0,c[0],c[1],W*0.34);
  g.addColorStop(0,'rgba(31,110,190,.14)');
  g.addColorStop(.6,'rgba(24,80,150,.06)');
  g.addColorStop(1,'rgba(24,80,150,0)');
  ctx.save();
  ctx.translate(c[0],c[1]); ctx.scale(1,0.42); ctx.translate(-c[0],-c[1]);
  ctx.fillStyle=g;
  ctx.fillRect(c[0]-W*0.36,c[1]-W*0.36,W*0.72,W*0.72);
  ctx.restore();
}

function drawOrbits(t){
  /* anillos orbitales con dashes rotando — hologram deck */
  const rings=[{r:500,sp:.05,n:90,al:.12},{r:590,sp:-.032,n:120,al:.09}];
  ctx.lineWidth=1.2;
  for(const rg of rings){
    ctx.strokeStyle=`rgba(51,196,255,${rg.al})`;
    for(let i=0;i<rg.n;i++){
      if(i%3===2) continue;              /* patrón de dash */
      const a0=(i/rg.n)*TAU + t*rg.sp, a1=((i+0.72)/rg.n)*TAU + t*rg.sp;
      const p0=P(Math.cos(a0)*rg.r,0,Math.sin(a0)*rg.r*0.72);
      const p1=P(Math.cos(a1)*rg.r,0,Math.sin(a1)*rg.r*0.72);
      ctx.beginPath(); ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p1[0],p1[1]); ctx.stroke();
    }
  }
  /* ticks cada 15° en el anillo exterior */
  ctx.strokeStyle='rgba(51,196,255,.2)'; ctx.lineWidth=1.4;
  for(let i=0;i<24;i++){
    const a=i/24*TAU + t*0.05;
    const c=Math.cos(a), s=Math.sin(a);
    const p0=P(c*598,0,s*598*0.72), p1=P(c*622,0,s*622*0.72);
    ctx.beginPath(); ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p1[0],p1[1]); ctx.stroke();
  }
  /* satélites recorriendo los anillos, con estela */
  const SATS=[{r:500,sp:.11,ph:0},{r:590,sp:-.07,ph:2.1},{r:590,sp:-.07,ph:5.2}];
  for(const sat of SATS){
    const a0=t*sat.sp+sat.ph;
    for(let j=9;j>=0;j--){
      const a=a0-j*0.05*Math.sign(sat.sp);
      const p=P(Math.cos(a)*sat.r,0,Math.sin(a)*sat.r*0.72);
      const al=(1-j/10)*0.7;
      ctx.fillStyle=j===0?`rgba(210,240,255,${al})`:`rgba(90,200,255,${(al*0.5).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(p[0],p[1],j===0?2.2:1.4,0,TAU); ctx.fill();
    }
  }
}

function buildPaths(entr){
  const silh=new Path2D(), each=[];
  for(let i=0;i<PROV.length;i++){
    const pp=new Path2D();
    for(const r of PROV[i].rings) ring2path(pp,r,entr[i].y);
    each.push(pp); silh.addPath(pp);
  }
  return {silh,each};
}

function drawMap(t,tc,paths,entr){
  const {silh,each}=paths;
  const gAll=sm((tc-0.4)/3.8);      /* contornos generales */
  const hold=sm((tc-5)/1.5);        /* efectos de crucero */

  /* halo costero */
  ctx.strokeStyle=`rgba(51,196,255,${(0.07*gAll).toFixed(3)})`; ctx.lineWidth=11; ctx.stroke(silh);
  ctx.strokeStyle=`rgba(51,196,255,${(0.1*gAll).toFixed(3)})`;  ctx.lineWidth=5;  ctx.stroke(silh);

  /* rellenos por provincia — doble ola de luminancia cruzada */
  const waveX  = -560 + ((t%24)/24)*1120;
  const waveX2 =  560 - ((t%31)/31)*1120;
  for(let i=0;i<PROV.length;i++){
    const e=entr[i]; if(e.p<=0.01) continue;
    const pr=PROV[i];
    const d1=(pr.cx-waveX)/95, d2=(pr.cx-waveX2)/110;
    const wave=(Math.exp(-d1*d1)*0.34 + Math.exp(-d2*d2)*0.20)*hold;
    /* respiración individual por provincia */
    const base=(0.30 + 0.08*Math.sin(t*0.42+i*2.13))*(0.25+0.75*e.p);
    ctx.fillStyle=`rgba(23,74,133,${(base+wave).toFixed(3)})`;
    ctx.fill(each[i]);
    if(wave>0.02){ ctx.fillStyle=`rgba(51,196,255,${(wave*0.35).toFixed(3)})`; ctx.fill(each[i]); }
    /* destello de materialización */
    if(e.p>0 && e.p<1){
      ctx.strokeStyle=`rgba(190,235,255,${(Math.sin(Math.PI*e.p)*0.4).toFixed(3)})`;
      ctx.lineWidth=1.4; ctx.stroke(each[i]);
    }
    /* ping de aterrizaje */
    const u=(tc-(e.start+1.05))/0.9;
    if(u>0 && u<1){ ctx.lineWidth=1.2; nodeRing(pr.cx,pr.cz,4+u*44,(1-u)*0.4); }
  }

  /* frente de materialización — línea que guía la entrada oeste→este */
  if(tc>0.4 && tc<4.6){
    const fx=XMIN-24 + sm((tc-0.5)/3.4)*(XMAX-XMIN+48);
    const bell=Math.sin(Math.PI*Math.min(1,(tc-0.4)/4.2));
    const a0=P(fx,0,ZMIN-30), a1=P(fx,0,ZMAX+30);
    const g=ctx.createLinearGradient(a0[0],a0[1],a1[0],a1[1]);
    g.addColorStop(0,'rgba(140,220,255,0)');
    g.addColorStop(.5,`rgba(170,230,255,${(bell*0.7).toFixed(3)})`);
    g.addColorStop(1,'rgba(140,220,255,0)');
    ctx.strokeStyle=g; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(a0[0],a0[1]); ctx.lineTo(a1[0],a1[1]); ctx.stroke();
    ctx.strokeStyle=`rgba(120,210,255,${(bell*0.16).toFixed(3)})`; ctx.lineWidth=7;
    ctx.beginPath(); ctx.moveTo(a0[0],a0[1]); ctx.lineTo(a1[0],a1[1]); ctx.stroke();
  }

  /* pulsos provinciales — dos canales independientes durante el crucero */
  if(tc>8.5 && tc<CYC-4){
    /* canal A: flash + anillo + trazador recorriendo el contorno */
    const win=4.3, k=Math.floor(t/win);
    const pi=((k*2654435761)>>>0)%PROV.length;
    const u=(t%win)/1.5, u2=(t%win)/win;
    if(u<1){
      const a=Math.sin(Math.PI*u)*0.5;
      ctx.fillStyle=`rgba(51,196,255,${(a*0.22).toFixed(3)})`; ctx.fill(each[pi]);
      ctx.strokeStyle=`rgba(190,235,255,${(a*0.55).toFixed(3)})`;
      ctx.lineWidth=1.3; ctx.stroke(each[pi]);
      ctx.lineWidth=1.2; nodeRing(PROV[pi].cx,PROV[pi].cz,6+u*50,(1-u)*0.35);
    }
    /* trazador de borde: chispa que recorre el contorno completo */
    const ring=PROV[pi].big;
    const n=ring.length/2, TRL=15;
    ctx.lineWidth=1.6;
    let pv=null;
    for(let j=TRL;j>=0;j--){
      const idx=((Math.floor(u2*n)-j)%n+n)%n;
      const p=P(ring[idx*2],0,ring[idx*2+1]);
      if(pv){
        const al=(1-j/TRL)*0.85;
        ctx.strokeStyle=`rgba(200,240,255,${al.toFixed(3)})`;
        ctx.beginPath(); ctx.moveTo(pv[0],pv[1]); ctx.lineTo(p[0],p[1]); ctx.stroke();
      }
      pv=p;
    }
    if(pv){ ctx.fillStyle='rgba(230,248,255,.95)';
      ctx.beginPath(); ctx.arc(pv[0],pv[1],1.9,0,TAU); ctx.fill(); }
    /* canal B: brillo suave en otra provincia, período distinto */
    const k2=Math.floor(t/6.1);
    const pj=((k2*40503+977)>>>0)%PROV.length;
    const v=(t%6.1)/2.4;
    if(v<1 && pj!==pi){
      const b=Math.sin(Math.PI*v)*0.35;
      ctx.fillStyle=`rgba(80,190,255,${(b*0.18).toFixed(3)})`; ctx.fill(each[pj]);
      ctx.strokeStyle=`rgba(160,220,255,${(b*0.4).toFixed(3)})`;
      ctx.lineWidth=1.1; ctx.stroke(each[pj]);
    }
  }

  /* gradiente de profundidad — lejos más oscuro */
  if(hold>0){
    ctx.save(); ctx.clip(silh);
    const far=P(0,0,-330), near=P(0,0,330);
    const g=ctx.createLinearGradient(0,far[1],0,near[1]);
    g.addColorStop(0,`rgba(4,14,30,${(0.5*hold).toFixed(3)})`);
    g.addColorStop(.55,'rgba(4,14,30,0)');
    g.addColorStop(1,`rgba(80,180,255,${(0.06*hold).toFixed(3)})`);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  /* bordes provinciales */
  ctx.strokeStyle=`rgba(120,200,255,${(0.34*gAll).toFixed(3)})`; ctx.lineWidth=1.1; ctx.stroke(silh);
}

function drawRadar(t,tc,silh){
  if(!silh) return;
  const gate=sm((tc-7)/2); if(gate<=0) return;
  const keep=ctx.globalAlpha; ctx.globalAlpha=keep*gate;
  const a = t*0.42;
  const SEG=56, SPAN=1.25, R=620;
  ctx.save(); ctx.clip(silh);
  const wedge=(ang,span,maxAl)=>{
    for(let i=0;i<SEG;i++){
      const u=i/SEG;
      const a0=ang-span+u*span, a1=a0+span/SEG+0.004;
      const al=u*u*maxAl;
      const p0=P(Math.cos(a0)*R,0,Math.sin(a0)*R);
      const p1=P(Math.cos(a1)*R,0,Math.sin(a1)*R);
      const c=P(0,0,0);
      ctx.fillStyle=`rgba(80,200,255,${al.toFixed(3)})`;
      ctx.beginPath(); ctx.moveTo(c[0],c[1]);
      ctx.lineTo(p0[0],p0[1]); ctx.lineTo(p1[0],p1[1]); ctx.closePath(); ctx.fill();
    }
  };
  wedge(a,SPAN,0.26);
  wedge(-t*0.23-1.0,0.9,0.11);   /* segundo barrido, contrarrotante y tenue */
  /* borde líder — único uso del naranja junto a los cometas */
  const e0=P(0,0,0), e1=P(Math.cos(a)*R,0,Math.sin(a)*R);
  const g=ctx.createLinearGradient(e0[0],e0[1],e1[0],e1[1]);
  g.addColorStop(0,'rgba(255,122,0,0)');
  g.addColorStop(.55,'rgba(255,150,40,.34)');
  g.addColorStop(1,'rgba(255,190,90,.65)');
  ctx.strokeStyle=g; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.moveTo(e0[0],e0[1]); ctx.lineTo(e1[0],e1[1]); ctx.stroke();
  ctx.restore();
  ctx.globalAlpha=keep;
}

function drawScan(t,tc,silh){
  /* barrido de ingesta cada 11 s, alternando norte-sur / oeste-este */
  if(tc<8 || tc>CYC-4) return;
  const k=Math.floor(t/11), ph=(t%11)/3; if(ph>=1) return;
  const al=Math.sin(ph*Math.PI)*0.5;
  ctx.save(); ctx.clip(silh);
  if(k%2===0){
    const zline=-360+ph*720;
    const a=P(-540,0,zline), b=P(540,0,zline);
    const g=ctx.createLinearGradient(0,a[1]-26,0,a[1]+26);
    g.addColorStop(0,'rgba(140,220,255,0)');
    g.addColorStop(.5,`rgba(140,220,255,${(al*0.5).toFixed(3)})`);
    g.addColorStop(1,'rgba(140,220,255,0)');
    ctx.fillStyle=g;
    ctx.fillRect(0,Math.min(a[1],b[1])-26,W,52);
    ctx.strokeStyle=`rgba(200,240,255,${(al*0.8).toFixed(3)})`; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  }else{
    const xline=-540+ph*1080;
    const p1=P(xline-22,0,-360), p2=P(xline+22,0,-360),
          p3=P(xline+22,0,360),  p4=P(xline-22,0,360);
    const g=ctx.createLinearGradient((p1[0]+p4[0])/2,0,(p2[0]+p3[0])/2,0);
    g.addColorStop(0,'rgba(140,220,255,0)');
    g.addColorStop(.5,`rgba(140,220,255,${(al*0.5).toFixed(3)})`);
    g.addColorStop(1,'rgba(140,220,255,0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]);
    ctx.lineTo(p3[0],p3[1]); ctx.lineTo(p4[0],p4[1]); ctx.closePath(); ctx.fill();
    const m1=P(xline,0,-360), m2=P(xline,0,360);
    ctx.strokeStyle=`rgba(200,240,255,${(al*0.8).toFixed(3)})`; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(m1[0],m1[1]); ctx.lineTo(m2[0],m2[1]); ctx.stroke();
  }
  ctx.restore();
}

/* meteoros — trazos fugaces sobre el mapa */
function drawMeteors(t){
  const win=7.3, k=Math.floor(t/win), u=(t%win);
  if(u>1.1) return;
  const h=(s)=>{ const x=Math.sin(k*127.1+s*311.7)*43758.5453; return x-Math.floor(x); };
  const sx=(h(1)*2-1)*560, sz=(h(2)*2-1)*340, y=115+h(3)*70;
  const ang=h(4)*TAU, vx=Math.cos(ang)*540, vz=Math.sin(ang)*260;
  const bell=Math.sin(Math.PI*Math.min(1,u/1.1));
  const hx=sx+vx*u, hz=sz+vz*u;
  const p0=P(hx,y,hz), p1=P(hx-vx*0.16,y+9,hz-vz*0.16);
  const g=ctx.createLinearGradient(p0[0],p0[1],p1[0],p1[1]);
  g.addColorStop(0,`rgba(225,245,255,${(bell*0.9).toFixed(3)})`);
  g.addColorStop(1,'rgba(120,200,255,0)');
  ctx.strokeStyle=g; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p1[0],p1[1]); ctx.stroke();
}

function nodeRing(x,z,r,alpha){
  ctx.beginPath();
  for(let i=0;i<=26;i++){
    const a=i/26*TAU;
    const p=P(x+Math.cos(a)*r,0,z+Math.sin(a)*r);
    if(i===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]);
  }
  ctx.strokeStyle=`rgba(80,200,255,${alpha.toFixed(3)})`;
  ctx.stroke();
}

function drawNodes(t,tc){
  ctx.lineWidth=1.3;
  for(let i=0;i<NODES.length;i++){
    const nd=NODES[i];
    const nIn=sm((tc-(4.6+i*0.12))/0.8); if(nIn<=0) continue;
    /* pulso expansivo */
    const u=(t*0.42 + i*0.61)%1;
    nodeRing(nd.x,nd.z, 6+u*34*nd.w+10*nd.w, (1-u)*0.4*nIn);
    /* pilar de luz — crece al entrar */
    const h = (24 + nd.w*66 + Math.sin(t*0.6+i*2.1)*10*nd.w)*nIn;
    const b=P(nd.x,0,nd.z), tp=P(nd.x,h,nd.z);
    const g=ctx.createLinearGradient(b[0],b[1],tp[0],tp[1]);
    g.addColorStop(0,`rgba(90,200,255,${(0.5*nd.w+0.18)*nIn})`);
    g.addColorStop(1,'rgba(90,200,255,0)');
    ctx.strokeStyle=g; ctx.lineWidth=Math.max(1.4, 3.4*nd.w*b[2]);
    ctx.beginPath(); ctx.moveTo(b[0],b[1]); ctx.lineTo(tp[0],tp[1]); ctx.stroke();
    /* baliza parpadeante en la cima del pilar */
    const blink=Math.max(0,Math.sin(t*2.4+i*1.7));
    if(blink>0.1){
      ctx.fillStyle=`rgba(200,240,255,${(blink*blink*0.85*nIn).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(tp[0],tp[1],1.7,0,TAU); ctx.fill();
      ctx.fillStyle=`rgba(120,210,255,${(blink*blink*0.3*nIn).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(tp[0],tp[1],3.8,0,TAU); ctx.fill();
    }
    /* base */
    ctx.fillStyle=`rgba(220,245,255,${(0.95*nIn).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(b[0],b[1],(2.6*nd.w+1.2)*nIn,0,TAU); ctx.fill();
    ctx.fillStyle=`rgba(80,200,255,${(0.35*nIn).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(b[0],b[1],(5.4*nd.w+2)*nIn,0,TAU); ctx.fill();
    ctx.lineWidth=1.3;
  }
  /* ráfaga doble en un nodo aleatorio */
  if(tc>8 && tc<CYC-4){
    const k=Math.floor(t/5.3);
    const ni=((k*69621+13)>>>0)%NODES.length;
    const u=(t%5.3)/2.2;
    if(u<1){
      const nd=NODES[ni];
      ctx.lineWidth=1.5;
      nodeRing(nd.x,nd.z, 6+u*52, (1-u)*0.55);
      if(u>0.18) nodeRing(nd.x,nd.z, 6+(u-0.18)*52, (1-u)*0.35);
    }
  }
}

function arcPoint(A,Bn,hh,u){
  const iu=1-u;
  const x=iu*iu*A.x + 2*u*iu*((A.x+Bn.x)/2) + u*u*Bn.x;
  const z=iu*iu*A.z + 2*u*iu*((A.z+Bn.z)/2) + u*u*Bn.z;
  const y=2*u*iu*hh;
  return [x,y,z];
}

function drawArcs(t,tc){
  for(let k=0;k<ARC_TARGETS.length;k++){
    const aIn=sm((tc-(5.4+k*0.22))/1.1); if(aIn<=0) continue;
    const nd=NODES[ARC_TARGETS[k]];
    const dx=nd.x-HUB.x, dz=nd.z-HUB.z;
    const hh=Math.hypot(dx,dz)*0.34+46;
    /* traza — se dibuja desde el hub al entrar */
    const NSEG=Math.max(1,Math.round(30*aIn));
    ctx.beginPath();
    let tip=null;
    for(let i=0;i<=NSEG;i++){
      const w=arcPoint(HUB,nd,hh,(i/30)), p=P(w[0],w[1],w[2]);
      if(i===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]);
      tip=p;
    }
    ctx.strokeStyle='rgba(80,180,255,.13)'; ctx.lineWidth=1;
    ctx.stroke();
    if(aIn<1 && tip){ /* punta brillante mientras se traza */
      ctx.fillStyle='rgba(190,235,255,.9)';
      ctx.beginPath(); ctx.arc(tip[0],tip[1],2.2,0,TAU); ctx.fill();
      continue;                     /* cometas solo con el arco completo */
    }
    /* cometa — estela continua con cabeza naranja */
    const period=5.2 + k*0.83;
    const u=((t/period)+k*0.37)%1;
    const TR=16;
    let prev=null;
    for(let j=TR;j>=0;j--){
      const uu=u-j*0.0085; if(uu<0){ prev=null; continue; }
      const w=arcPoint(HUB,nd,hh,uu), p=P(w[0],w[1],w[2]);
      if(prev){
        const al=(1-j/TR)*0.75;
        ctx.strokeStyle=`rgba(130,215,255,${al.toFixed(3)})`;
        ctx.lineWidth=1.1+(1-j/TR)*1.5;
        ctx.beginPath(); ctx.moveTo(prev[0],prev[1]); ctx.lineTo(p[0],p[1]); ctx.stroke();
      }
      prev=p;
    }
    if(prev){
      ctx.fillStyle='rgba(255,176,80,.28)';
      ctx.beginPath(); ctx.arc(prev[0],prev[1],5.4,0,TAU); ctx.fill();
      ctx.fillStyle='rgba(255,196,110,.95)';
      ctx.beginPath(); ctx.arc(prev[0],prev[1],2.3,0,TAU); ctx.fill();
    }
  }
}

/* partículas — cerradas en el tiempo (sin estado): loop perfecto */
const PARTS=[];
(function(){
  let seed=7;
  const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  for(let i=0;i<150;i++){
    PARTS.push({x:(rnd()*2-1)*640, z:(rnd()*2-1)*400, y:12+rnd()*95,
      a1:.4+rnd()*.8, a2:.3+rnd()*.7, f1:.11+rnd()*.2, f2:.09+rnd()*.16,
      ph:rnd()*TAU, tw:.5+rnd()*2, r:.7+rnd()*1.5});
  }
})();
function drawParticles(t){
  for(const p of PARTS){
    const x=p.x+Math.sin(t*p.f1+p.ph)*26*p.a1;
    const z=p.z+Math.cos(t*p.f2+p.ph*1.7)*20*p.a2;
    const y=p.y+Math.sin(t*p.f2*1.3+p.ph)*9;
    const s=P(x,y,z);
    const tw=.5+.5*Math.sin(t*p.tw+p.ph*3);
    const al=(.1+.32*tw)*Math.min(1,s[2]*1.4);
    ctx.fillStyle=`rgba(150,215,255,${al.toFixed(3)})`;
    ctx.beginPath(); ctx.arc(s[0],s[1],p.r*s[2]*1.15,0,TAU); ctx.fill();
  }
}

function drawLabels(t,tc){
  if(W<700) return;   /* pantallas pequeñas: sin etiquetas */
  ctx.font='500 10px "Cascadia Mono",Consolas,monospace';
  try{ ctx.letterSpacing='2px'; }catch(e){}
  ctx.textBaseline='middle';
  let li=0;
  for(const nd of NODES){
    if(!nd.lbl) continue;
    const gate=sm((tc-(6.0+li*0.16))/0.9); li++;
    if(gate<=0) continue;
    const b=P(nd.x,0,nd.z);
    const al=Math.max(.3,Math.min(.85,(b[2]-0.55)*2.4))*Math.min(1,gate*1.5);
    ctx.strokeStyle=`rgba(120,200,255,${(al*0.5).toFixed(3)})`; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(b[0]+5,b[1]-4); ctx.lineTo(b[0]+16,b[1]-14); ctx.lineTo(b[0]+22,b[1]-14); ctx.stroke();
    /* revelado tipo terminal */
    const chars=Math.ceil(nd.n.length*gate);
    const txt=gate<1 ? nd.n.slice(0,chars)+'▏' : nd.n;
    ctx.fillStyle=`rgba(200,235,255,${al.toFixed(3)})`;
    ctx.fillText(txt, b[0]+26, b[1]-14);
  }
}

/* ============================================================
   BUCLE PRINCIPAL — continuo, sin reinicios
   ============================================================ */
let rafQueued=false;
function frame(now){
  rafQueued=false;
  const t=now/1000, tc=t%CYC;
  ctx.clearRect(0,0,W,H);
  camera(t);
  /* alfa maestro: disolución al final del ciclo → reinicio limpio */
  const M = 1 - sm((tc-(CYC-2.4))/2.0);
  const gIn = sm(tc/1.6);
  ctx.globalAlpha = M*gIn;
  drawGrid(t);
  drawGlow();
  drawOrbits(t);
  ctx.globalAlpha = M;
  const entr=entrance(tc);
  const paths=buildPaths(entr);
  drawMap(t,tc,paths,entr);
  drawRadar(t,tc,paths.silh);
  drawScan(t,tc,paths.silh);
  drawArcs(t,tc);
  drawNodes(t,tc);
  drawLabels(t,tc);
  ctx.globalAlpha = M*gIn;
  drawParticles(t);
  drawMeteors(t);
  ctx.globalAlpha = 1;
  if(!reduced && !rafQueued){ rafQueued=true; requestAnimationFrame(frame); }
}
/* reduced-motion: un solo fotograma de mitad de ciclo (escena completa) */
if(reduced) frame(20000); else requestAnimationFrame(frame);

/* ============================================================
   RELOJ + TICKER + UX
   ============================================================ */
const DAYS=['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
const MONTHS=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const elT=document.getElementById('t-time'), elD=document.getElementById('t-date');
function clock(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  elT.innerHTML=`${p(d.getHours())}<b>:</b>${p(d.getMinutes())}<b>:</b>${p(d.getSeconds())}`;
  elD.textContent=`${DAYS[d.getDay()]} ${p(d.getDate())} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
clock(); setInterval(clock,250);

/* ecualizador de telemetría — 42 barras con fases aleatorias, 2 naranjas */
(function(){
  const wave=document.getElementById('wave');
  let seed=13, html='';
  const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  for(let i=0;i<42;i++){
    const dur=(0.7+rnd()*1.3).toFixed(2), del=(-rnd()*2).toFixed(2);
    const cls=(i===13||i===29)?' class="o"':'';
    html+=`<i${cls} style="animation-duration:${dur}s;animation-delay:${del}s"></i>`;
  }
  wave.innerHTML=html;
})();

/* fullscreen al clic + cursor oculto en reposo */
document.addEventListener('click',()=>{
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
});
let idleT;
function wake(){ document.body.classList.remove('idle');
  clearTimeout(idleT); idleT=setTimeout(()=>document.body.classList.add('idle'),3200); }
document.addEventListener('mousemove',wake); wake();
</script>
